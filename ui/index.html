<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>File Tidier</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="mark">FT</div>
          <div>
            <h1>File Tidier</h1>
            <p>중복 확인과 파일명 정리</p>
          </div>
        </div>

        <section class="panel compact">
          <div class="label">선택 폴더</div>
          <div class="folder-path">D:\Books\정리전</div>
          <button class="primary-button" type="button">폴더 선택</button>
        </section>

        <section class="panel compact">
          <div class="label">스캔 옵션</div>
          <label class="check-row">
            <input type="checkbox" checked />
            하위 폴더 포함
          </label>
          <label class="check-row">
            <input type="checkbox" checked />
            zip/cbz 내부 파일명 확인
          </label>
          <label class="field-label" for="minSize">최소 크기</label>
          <div class="input-row">
            <input id="minSize" value="1" />
            <span>KB</span>
          </div>
        </section>

        <section class="scan-summary">
          <div>
            <span class="metric">42</span>
            <span class="metric-label">검사 파일</span>
          </div>
          <div>
            <span class="metric warn">3</span>
            <span class="metric-label">중복 의심</span>
          </div>
          <div>
            <span class="metric good">3</span>
            <span class="metric-label">변경 가능</span>
          </div>
        </section>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <div class="eyebrow">Demo Preview</div>
            <h2>화면에서 보게 될 작업 흐름</h2>
          </div>
          <div class="action-strip">
            <button type="button">크기 비교</button>
            <button type="button">내용 비교</button>
            <button type="button" class="active">제목 중복 확인</button>
          </div>
        </header>

        <section class="content-grid">
          <section class="panel duplicate-panel">
            <div class="section-header">
              <div>
                <h3>중복 의심 파일</h3>
                <p>파일명과 zip 내부 항목에서 같은 책 제목으로 보이는 항목입니다.</p>
              </div>
              <button type="button">경로 복사</button>
            </div>

            <div class="table duplicate-table" id="duplicateTable"></div>
          </section>

          <section class="panel rename-panel">
            <div class="section-header">
              <div>
                <h3>파일명 바꾸기</h3>
                <p>찾을 텍스트가 앞, 뒤, 포함, 전체 중 어디에 있을 때 적용할지 선택합니다.</p>
              </div>
              <button type="button" class="disabled">적용</button>
            </div>

            <div class="rename-form">
              <label>
                찾기
                <input id="findText" value="(아이)" />
              </label>
              <label>
                바꾸기
                <input id="replaceText" value="" placeholder="비워두면 제거" />
              </label>
              <div>
                <span class="field-title">위치</span>
                <div class="segmented" id="positionButtons">
                  <button type="button" class="selected" data-position="front">앞</button>
                  <button type="button" data-position="back">뒤</button>
                  <button type="button" data-position="contains">포함</button>
                  <button type="button" data-position="exact">전체</button>
                </div>
              </div>
              <label class="switch-row">
                <input id="regexMode" type="checkbox" />
                정규식
              </label>
            </div>

            <div class="preview-callout">
              현재 예시는 <strong>(아이)</strong>가 맨 앞에 붙은 파일만 바뀝니다.
            </div>

            <div class="table rename-table" id="renameTable"></div>
          </section>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
