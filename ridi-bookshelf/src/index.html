<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIDI &#52293;&#51109;</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-word">
            <strong>RIDI</strong>
            <span>&#52293;&#51109;</span>
          </div>
          <p id="syncLabel">&#50500;&#51649; &#49688;&#51665; &#51204;</p>
        </div>

        <nav class="side-nav">
          <section>
            <h2>&#49688;&#51665; &#44592;&#44036;</h2>
            <div id="periodFilter" class="nav-list"></div>
          </section>

          <section>
            <h2>&#49688;&#51665;&#54624; &#51109;&#47476;</h2>
            <div id="categoryList" class="check-list"></div>
            <button id="scrapeButton" class="wide-primary">&#51109;&#47476; &#49688;&#51665;</button>
          </section>

          <section>
            <h2>&#51089;&#44032; &#44048;&#49884;</h2>
            <form id="authorForm" class="author-form">
              <input id="authorInput" type="text" placeholder="&#51089;&#44032;&#47749;">
              <button id="addAuthorButton" type="submit">&#52628;&#44032;</button>
            </form>
            <div id="authorList" class="author-list"></div>
            <button id="authorScrapeButton" class="wide-soft">&#51089;&#44032; &#49688;&#51665;</button>
          </section>

          <section>
            <h2>&#51109;&#47476;&#48324; &#48372;&#44592;</h2>
            <div id="categoryFilter" class="nav-list"></div>
          </section>

          <section>
            <h2>&#52293; &#49345;&#53468;</h2>
            <div class="status-filter" id="statusFilter">
              <button data-status="&#51204;&#52404;" class="selected">&#51204;&#52404;</button>
              <button data-status="&#44288;&#49900;">&#44288;&#49900;</button>
              <button data-status="&#51069;&#45716; &#51473;">&#51069;&#45716; &#51473;</button>
              <button data-status="&#50756;&#46021;">&#50756;&#46021;</button>
            </div>
          </section>
        </nav>
      </aside>

      <section class="content">
        <header class="toolbar">
          <label class="search-wrap">
            <span>&#44160;&#49353;</span>
            <input id="searchInput" type="search" placeholder="&#51228;&#47785;, &#51089;&#44032;, &#47700;&#47784;">
          </label>
          <div class="toolbar-actions">
            <button id="favoritesOnly" class="soft-button" type="button">&#48324;&#54364;&#47564;</button>
            <button id="exportButton" class="blue-button" type="button">JSON &#45236;&#48372;&#45236;&#44592;</button>
          </div>
        </header>

        <section class="shelf-summary" id="summary"></section>
        <section id="message" class="message hidden"></section>
        <section id="bookGrid" class="book-grid"></section>
      </section>
    </main>

    <dialog id="bookDialog" class="book-dialog">
      <form method="dialog" class="dialog-body">
        <button class="dialog-close" value="cancel" title="Close">x</button>
        <div class="dialog-cover-wrap">
          <img id="dialogCover" class="dialog-cover" alt="">
        </div>
        <div class="dialog-detail">
          <div class="dialog-meta">
            <span id="dialogRank"></span>
            <span id="dialogCategory"></span>
          </div>
          <div class="dialog-title-row">
            <h2 id="dialogTitle"></h2>
            <button id="dialogFavorite" class="title-star" type="button" title="별표">☆</button>
          </div>
          <p id="dialogAuthor"></p>
          <div id="dialogTags" class="tag-row dialog-tags hidden"></div>
          <label>
            &#49345;&#53468;
            <select id="dialogStatus">
              <option>&#44288;&#49900;</option>
              <option>&#51069;&#45716; &#51473;</option>
              <option>&#50756;&#46021;</option>
              <option>&#48372;&#47448;</option>
            </select>
          </label>
          <label>
            &#47700;&#47784;
            <textarea id="dialogNote" rows="7" placeholder="&#52712;&#54693; &#54252;&#51064;&#53944;, &#44396;&#47588; &#50668;&#48512;, &#51069;&#51008; &#44048;&#49345;&#51012; &#51201;&#50612;&#46160;&#49464;&#50836;."></textarea>
          </label>
          <div class="dialog-actions">
            <button id="dialogOpen" type="button">&#47532;&#46356;&#50640;&#49436; &#48372;&#44592;</button>
            <button id="dialogSave" value="default">&#51200;&#51109;</button>
          </div>
        </div>
        <aside class="dialog-review-panel">
          <div class="review-panel-head">
            <strong>&#51064;&#44592; &#47532;&#48624;</strong>
            <span>&#44277;&#44048;&#49692;</span>
          </div>
          <div id="dialogReviews" class="review-list hidden"></div>
        </aside>
      </form>
    </dialog>

    <script src="./renderer.js"></script>
  </body>
</html>
