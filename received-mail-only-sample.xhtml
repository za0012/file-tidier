<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="ko" xml:lang="ko">
<head>
  <title>received mail only</title>
  <link rel="stylesheet" type="text/css" href="received-mail-only.css" />
</head>
<body>
  <section class="received-mail-cut">
    <article class="received-mail">
      <div class="received-mail__head">
        받은 우편
        <span class="received-mail__close">×</span>
      </div>
      <div class="received-mail__body">
        <div class="received-mail__meta">
          <div class="received-mail__meta-row">
            <span>보낸 사람 : 천노을</span>
            <span>종류 : 일반 우편</span>
          </div>
          <div class="received-mail__meta-row">
            <span>제목 : ㅠㅠ</span>
            <span></span>
          </div>
        </div>
        <div class="received-mail__date">방금 전</div>
        <div class="received-mail__message">
          오늘은 안 들어오세요???<br />
          귓속말하면 없는 상대라고 뜨는데….
        </div>
        <p class="received-mail__attach-title">첨부물품</p>
        <div class="received-mail__slots">
          <span class="received-mail__slot received-mail__slot--item"></span>
          <span class="received-mail__slot"></span>
          <span class="received-mail__slot"></span>
          <span class="received-mail__slot"></span>
          <span class="received-mail__slot"></span>
        </div>
        <div class="received-mail__item-info">
          <span>끈끈한 녹조류</span>
          <span>낚시 아이템</span>
        </div>
        <div class="received-mail__actions">
          <span>모두 받기</span>
          <span>반송</span>
          <span class="is-disabled">삭제</span>
        </div>
      </div>
    </article>
  </section>
</body>
</html>
