<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="ko" xml:lang="ko">
<head>
  <title>mail insert sample</title>
  <link rel="stylesheet" type="text/css" href="epub-mail-only.css" />
</head>
<body>
  <section class="mail-cut">
    <p class="mail-cut-title">게임 내 우편</p>
    <div class="mail-window">
      <div class="mail-window-head">우편</div>
      <div class="mail-tabs">
        <span class="is-active">받은 우편</span>
        <span>보낸 우편</span>
        <span>편지쓰기</span>
      </div>
      <div class="mail-toolbar">
        <span>□ 전체선택</span>
        <span>보관 우편 1/50</span>
      </div>
      <div class="mail-selected">
        <span class="mail-selected-icon"></span>
        <span class="mail-selected-main">
          <strong>천노을</strong>
          <em>ㅠㅠ</em>
        </span>
        <span class="mail-selected-time">방금 전</span>
      </div>
      <article class="mail-letter">
        <div class="mail-letter-head">
          <strong>ㅠㅠ</strong>
          <span>일반 우편</span>
        </div>
        <div class="mail-meta">
          <div><span>보낸 사람</span><b>천노을</b></div>
          <div><span>수신</span><b>방금 전</b></div>
        </div>
        <div class="mail-message">
          오늘은 안 들어오세요??? 귓속말하면 없는 상대라고 뜨는데….
        </div>
        <p class="mail-attach-title">첨부 물품</p>
        <div class="mail-attach-slots">
          <span class="mail-item-slot">
            <span class="mail-item-icon"></span>
            <span class="mail-item-name">끈끈한 녹조류</span>
          </span>
          <span class="mail-empty-slot"></span>
          <span class="mail-empty-slot"></span>
          <span class="mail-empty-slot"></span>
        </div>
        <div class="mail-attach-type">낚시 아이템</div>
        <div class="mail-actions">
          <span>첨부 받기</span>
          <span>반송</span>
          <span class="is-muted">삭제</span>
        </div>
      </article>
    </div>
  </section>
</body>
</html>
